<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Royals Combat Command // Standard March Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        :root {
            --bg-base: #060911;
            --bg-card: rgba(12, 19, 34, 0.78);
            --bg-card-border: rgba(56, 189, 248, 0.18);
            
            /* Dynamic Accent Color */
            --accent-glow: #38bdf8;
            --accent-glow-rgb: 56, 189, 248;
            --accent-soft: rgba(56, 189, 248, 0.12);
            
            /* Troop Class Signatures */
            --tc-ranged: #38bdf8;
            --tc-mounted: #f59e0b;
            --tc-ground: #10b981;
            --tc-siege: #c084fc;
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-faint: #475569;
        }

        body.theme-ranged {
            --accent-glow: #38bdf8;
            --accent-glow-rgb: 56, 189, 248;
            --accent-soft: rgba(56, 189, 248, 0.12);
        }
        body.theme-ground {
            --accent-glow: #10b981;
            --accent-glow-rgb: 16, 185, 129;
            --accent-soft: rgba(16, 185, 129, 0.12);
        }
        body.theme-mounted {
            --accent-glow: #f59e0b;
            --accent-glow-rgb: 245, 158, 11;
            --accent-soft: rgba(245, 158, 11, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(var(--accent-glow-rgb), 0.12) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 16px 12px 48px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        .war-container {
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
            opacity: 0.35;
        }

        /* Tactical Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 60px; height: 2px;
            background: var(--accent-glow);
            box-shadow: 0 0 10px var(--accent-glow);
            transition: 0.3s;
        }

        /* Tactical Google Translate Bar */
        .translate-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 12px;
            padding: 4px 6px;
        }

        #google_translate_element select {
            background-color: #0b1220 !important;
            color: var(--accent-glow) !important;
            border: 1px solid rgba(var(--accent-glow-rgb), 0.3) !important;
            border-radius: 8px !important;
            padding: 6px 12px !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 12px !important;
            outline: none !important;
            font-weight: 600 !important;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .goog-te-gadget { color: transparent !important; font-size: 0px !important; }
        .goog-te-gadget span, .goog-te-banner-frame, #goog-gt-tt, .goog-logo-link { display: none !important; }

        /* Header Block */
        .header-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 20px 24px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .sys-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-glow);
            background: var(--accent-soft);
            border: 1px solid rgba(var(--accent-glow-rgb), 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .pulse-beacon {
            width: 7px;
            height: 7px;
            background-color: var(--accent-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-glow);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(var(--accent-glow-rgb), 0.3);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sound-toggle {
            background: transparent;
            border: 1px solid var(--text-faint);
            color: var(--text-muted);
